name: Bug Report
description: Reportar comportamento inesperado ou defeito
title: "[BUG] "
labels:
  - bug
body:

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Descreva o problema encontrado.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Informe os passos para reproduzir o problema.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - DEV
        - HML
        - PROD
        - Local
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Logs, prints ou outras informações relevantes.
